name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 创建 GitHub Release 所需

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package (NSIS)
        # tag 推送（v*）时自动创建 GitHub Release 草稿并上传安装包 + latest.yml + blockmap；
        # 手动触发只构建不发布（--publish never）
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            npx electron-builder --win --publish always
          } else {
            npx electron-builder --win --publish never
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownSoft-win
          path: release/*/MarkdownSoft-Setup-*.exe
          retention-days: 7

  # ── macOS ────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package (DMG)
        # 同 Windows：tag 推送自动发布到 GitHub Release 草稿，手动触发只构建
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --mac --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownSoft-mac
          path: release/*/*.dmg
          retention-days: 7

  # ── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev fakeroot

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package (AppImage)
        # 同 Windows：tag 推送自动发布到 GitHub Release 草稿，手动触发只构建
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --linux --publish always
          else
            npx electron-builder --linux --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownSoft-linux
          path: release/*/*.AppImage
          retention-days: 7

  # 注：tag 推送时各平台 job 已用 electron-builder --publish always 创建
  # GitHub Release 草稿并上传全部产物（安装包 + latest.yml + blockmap），
  # 不再需要单独的 release job；人工在 GitHub 审核草稿后点击发布，
  # 客户端 electron-updater 即能检查到新版本
